<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automating Excel Project Grading</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/analysis.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const sources = [
      './src/lib/simulate.js',
      './src/lib/csv.js',
      './src/components/Metric.jsx',
      './src/components/QueueChart.jsx',
      './src/components/DynamicFlowChart.jsx',
      './src/components/Controls.jsx',
      './src/components/NetlifyInspiredSections.jsx',
      './src/components/DetailedAnalysis.jsx',
      './src/App.jsx',
      './src/main.jsx',
    ];

    Promise.all(sources.map(path => fetch(path).then(response => response.text())))
      .then(parts => {
        const compiled = Babel.transform(parts.join('\n'), { presets: [['react', { runtime: 'classic' }]] }).code
          .replace(/^\s*import[\s\S]*?;\s*/gm, '')
          .replace(/^\s*export\s+(default\s+)?/gm, '');
        new Function('React', 'ReactDOM', compiled)(React, ReactDOM);
      })
      .catch(error => {
        document.getElementById('root').innerHTML = '<p style="padding:24px;color:#b42318">The interactive page could not load. Please refresh the page.</p>';
        console.error(error);
      });
  </script>
</body>
</html>
