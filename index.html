<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automating Excel Project Grading</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/analysis.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    fetch('./src/main.jsx')
      .then(response => response.text())
      .then(source => {
        const compiled = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] }).code
          .replace(/^\s*import[\s\S]*?;\s*/gm, '')
          .replace(/^\s*export\s+(default\s+)?/gm, '');
        new Function('React', 'ReactDOM', compiled)(React, ReactDOM);
      })
      .catch(error => {
        document.getElementById('root').innerHTML = '<p style="padding:24px;color:#b42318">The interactive page could not load. Please refresh the page.</p>';
        console.error(error);
      });
  </script>
</body>
</html>
